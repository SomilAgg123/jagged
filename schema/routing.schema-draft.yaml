# models.yaml — DRAFT schema v0.3 (2026-10-24; SOURCE_RUBRIC.md v2, per-claim recency)
# Two top-level collections:
#   models:   one entry per routable (model, reasoning_effort) config, with time- and context-tiered pricing
#   subtasks: one entry per subtask, with proxy benchmarks, evidence, and picks
# ROUTING.md is generated from this file. Numbers must cite a source; unknown -> null.

schema_version: 0.3
generated: 2026-10-24
timezone: America/Los_Angeles

# ---------------------------------------------------------------- field spec
# models[]:
#   id:               stable slug "<provider>/<model>@<effort>"
#   provider, model, api_model_name, reasoning_effort
#   open_weights:     yes | no | pending
#   api_available:    bool (false for e.g. Muse Wonder Full)
#   context_window:   int tokens
#   pricing[]:        list of price windows; harness picks the one matching today + prompt size
#     - input_usd_per_mtok, output_usd_per_mtok, cached_input_usd_per_mtok
#       valid_from / valid_until (null = open-ended), prompt_tokens_min / max
#       modifiers: {peak_hours_utc, batch_discount, data_residency_multiplier}
#       source_url, source_type: provider | third_party, checked
# subtasks[]:
#   id, description, routing_signals (hints the harness can use to classify a step)
#   proxies[]:        {benchmark, runner, weight, status: maintained|saturated|stale, independent: bool, harness, url}
#   good_enough:      {benchmark, rule}  e.g. "within 6 pts of best" or ">= 55%"
#   evidence[]:       {model_id, benchmark, score, cost_per_task_usd, harness, network, source_url, checked,
#                      source_id (row in sources.csv), source_tier: A|B|C, runner, role: pick|method|price,
#                      --- recency (SOURCE_RUBRIC.md §4, required on every row) ---
#                      evidence_date:        YYYY-MM-DD, "YYYY-MM" if only the month is known, or null if unknown
#                      evidence_date_basis:  row_date | board_update | model_release_lower_bound | publication | unknown
#                      age_days:             int, date_checked - evidence_date; null if unknown
#                      age_is_upper_bound:   bool, true when evidence_date is a lower bound or month-only
#                      freshness:            fresh (<=90 d) | aging (91-180 d) | stale (>180 d) | unknown (treated as stale)
#                      stale:                bool, true when freshness is stale or unknown
#                      claim_scope:          direct (this exact model + effort was tested) | family (predecessor/sibling/other effort; R3)
#                      tested_model:         the model the source actually ran, when claim_scope = family
#                      price_verified:       bool, list price of the tested model re-checked on the provider page on `checked` (R2)
#                      cost_at_evidence_date: bool, true = cost_per_task_usd uses the prices in force when the row ran
#                      effective_tier:       A|B, source_tier after R2-R4 (never higher than source_tier)}
#                     Only tier A/B may appear; at most 3 cited per pick (SOURCE_RUBRIC.md §6).
#   picks:            {best_quality, good_enough, budget} -> {model_id, status, cites[], why,
#                      relies_on_older_evidence: bool (any cited row aging/stale/unknown or family),
#                      anchored: bool | null (R5; null when every cited row is fresh)}
#   status:           supported | provisional | contested | insufficient   (per pick; SOURCE_RUBRIC.md §6)
#   caveats[]:        free text
#   review_by:        date after which picks must be re-verified (earliest price expiry or ~30 days)


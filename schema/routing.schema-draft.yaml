    proxies:
      - {benchmark: terminal-bench-4.0, runner: Vals AI, weight: 0.6, status: maintained, independent: true,
         harness: mini-swe-agent (bash only), scoring: avg@3 pass@1, url: https://www.vals.ai/benchmarks/terminal-bench-4}
      - {benchmark: terminal-bench-4.0, runner: Artificial Analysis, weight: 0.4, status: maintained, independent: true,
         harness: AA, url: https://artificialanalysis.ai/evaluations/terminalbench-4-0}
    good_enough:
      benchmark: terminal-bench-4.0 (Vals)
      rule: "score >= best - 10 pts and cheaper per task (SOURCE_RUBRIC.md §6)"
    evidence:
